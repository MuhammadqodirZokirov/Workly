name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: workly
          POSTGRES_PASSWORD: workly
          POSTGRES_DB: workly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workly" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL)
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://workly:workly@localhost:5432/workly_test
      - name: Migrations up to date
        run: alembic upgrade head && alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://workly:workly@localhost:5432/workly_test
          JWT_SECRET: ci
          BOT_TOKEN: "1:ci"
          DATA_ENCRYPTION_KEY: 7kS8GqkH1xBzuxwWm0bTtBvVh3gJ2pQ1l0kQyE4H0rM=
          DATA_HASH_KEY: ci

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npx vitest run
      - run: npx vite build

  docker:
    # Serverga joylash obrazlari build bo'ladimi (push qilinmaydi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compose config
        run: docker compose -f deploy/docker-compose.yml config -q
        env:
          DOMAIN: example.uz
          ACME_EMAIL: admin@example.uz
          POSTGRES_PASSWORD: ci
      - name: Build api
        run: docker build -t workly-api backend
      - name: Build web
        run: docker build -t workly-web -f deploy/web.Dockerfile .
