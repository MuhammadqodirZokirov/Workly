[project]
name = "rabotago"
version = "0.1.0"
description = "RabotaGo backend: FastAPI API + aiogram bot"
requires-python = ">=3.11"
dependencies = [
    "fastapi~=0.141",
    "uvicorn[standard]~=0.54",
    "pydantic~=2.13",
    "pydantic-settings~=2.15",
    "sqlalchemy[asyncio]~=2.1",
    "asyncpg~=0.31",
    "alembic~=1.20",
    "redis~=8.1",
    "pyjwt~=2.15",
    "httpx~=0.28",
    "aiogram~=3.31",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.1",
    "pytest-asyncio~=1.4",
    "aiosqlite~=0.22",
    "fakeredis~=2.38",
    "ruff~=0.16",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rabotago*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["rabotago"]
known-third-party = ["alembic"]
